{% extends "base.html" %}
{% load i18n static %}

{% block title %}{% translate "Огляд" %} · CashFlix{% endblock %}

{% block content %}
  <div id="overview"
       hx-get="{% url 'core:home' %}{% if member %}?member={{ member.pk }}{% endif %}"
       hx-trigger="transactionsChanged from:body" hx-disinherit="*">
    {% include "core/_overview.html" %}
  </div>

  <button class="fab" type="button" hx-get="{% url 'money:transaction_create' %}" hx-target="#tx-dialog-body" aria-label="{% translate 'Нова операція' %}"><c-icon name="plus" /></button>

  <dialog class="sheet-cf" id="tx-dialog" aria-label="{% translate 'Операція' %}">
    <div id="tx-dialog-body"></div>
  </dialog>
{% endblock %}

{% block scripts %}
  <script src="{% static 'vendor/apexcharts/apexcharts.min.js' %}" defer></script>
  <script src="{% static 'js/charts.js' %}" defer></script>
{% endblock %}
