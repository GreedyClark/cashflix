{% load allauth %}{% if attrs.href %}<a class="btn-cf{% if 'prominent' in attrs.tags or 'primary' in attrs.tags %} primary{% endif %}" href="{{ attrs.href }}">{% slot %}{% endslot %}</a>{% else %}<button class="btn-cf{% if 'prominent' in attrs.tags or 'primary' in attrs.tags or attrs.type == 'submit' %} primary{% endif %}"{% if attrs.form %} form="{{ attrs.form }}"{% endif %}{% if attrs.id %} id="{{ attrs.id }}"{% endif %}{% if attrs.name %} name="{{ attrs.name }}"{% endif %}{% if attrs.value %} value="{{ attrs.value }}"{% endif %} type="{{ attrs.type|default:'submit' }}">{% slot %}{% endslot %}</button>{% endif %}
