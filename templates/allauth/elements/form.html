{% load allauth %}
<form class="auth-form" method="{{ attrs.method }}"{% if attrs.action %} action="{{ attrs.action }}"{% endif %} novalidate>
  {% if attrs.form.non_field_errors %}
    {% for error in attrs.form.non_field_errors %}<p class="alert-cf error">{{ error }}</p>{% endfor %}
  {% endif %}
  {% slot body %}{% endslot %}
  <div class="auth-actions">{% slot actions %}{% endslot %}</div>
</form>
