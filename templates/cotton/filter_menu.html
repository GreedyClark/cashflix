<c-vars menu />
<details class="menu-cf chip-menu align-{{ menu.align }}">
  <summary class="chip-cf{% if menu.label %} is-set{% endif %}">
    <c-icon :name="menu.icon" />
    <span>{{ menu.label|default:menu.placeholder }}</span>
    <c-icon name="chevron-down" />
  </summary>
  <div class="chip-pop" role="radiogroup" aria-label="{{ menu.placeholder }}">
    {% for option in menu.options %}
      {% if option.heading %}
        <div class="chip-heading">{{ option.heading }}</div>
      {% else %}
        <label class="chip-option">
          <input type="radio" name="{{ menu.name }}" value="{{ option.value }}"{% if option.checked %} checked{% endif %}>
          {% if option.icon %}
            <span class="chip-option-icon tone-{{ option.tone }}"><c-icon :name="option.icon" /></span>
          {% elif option.initial %}
            <span class="avatar-cf mini color-{{ option.color }}">{{ option.initial }}</span>
          {% endif %}
          <span class="chip-option-label">{{ option.label }}</span>
          <c-icon name="check" />
        </label>
      {% endif %}
    {% endfor %}
  </div>
</details>
