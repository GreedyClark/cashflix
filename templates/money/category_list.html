{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Категорії" %} · CashFlix{% endblock %}

{% block content %}
  <div class="page-head">
    <div>
      <p class="eyebrow">{{ request.household.name }}</p>
      <h1 class="page-title">{% translate "Категорії" %}</h1>
    </div>
    <div class="page-actions">
      <button class="btn-cf primary" type="button" hx-get="{% url 'money:category_create' %}" hx-target="#tx-dialog-body"><c-icon name="plus" />{% translate "Категорія" %}</button>
    </div>
  </div>

  <div id="categories" class="cat-page"
       hx-get="{% url 'money:categories' %}{% if archived %}?archived=1{% endif %}"
       hx-trigger="categoriesChanged from:body" hx-disinherit="*">
    {% include "money/_category_list.html" %}
  </div>

  <dialog class="sheet-cf" id="tx-dialog" aria-label="{% translate 'Категорія' %}">
    <div id="tx-dialog-body"></div>
  </dialog>
{% endblock %}
